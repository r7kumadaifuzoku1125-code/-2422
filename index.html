        return;
    }
    const saveData = {
        score: score,
        maxBalls: maxBalls,
        totalRowsSpawned: totalRowsSpawned,
        hasAnsweredThisTurn: hasAnsweredThisTurn,
        bricks: bricks,
        items: items,
        difficulty: selectedDifficulty,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    try {
        await db.collection("game_states").doc(playerName).set(saveData);
    } catch (e) {
        console.error("Firestore Save Game State Error:", e);
    }
}

async function loadGameState() {
    try {
        const doc = await db.collection("game_states").doc(playerName).get();
        if (!doc.exists) return false;
        
        const data = doc.data();
        score = data.score || 0;
        maxBalls = data.maxBalls || 1;
        totalRowsSpawned = data.totalRowsSpawned || 1;
        hasAnsweredThisTurn = !!data.hasAnsweredThisTurn;
        bricks = data.bricks || [];
        items = data.items || [];
        selectedDifficulty = data.difficulty || "normal";
        return true;
    } catch (e) {
        console.error("Firestore Load Game State Error:", e);
        return false;
    }
}

async function clearGameState() {

function initRealtimeRankings() {
    db.collection("rankings_v2")
      .onSnapshot((snapshot) => {
          rankingsByDiff = { easy: [], normal: [], hard: [] };
          snapshot.forEach((doc) => {
              const data = doc.data();
              const diff = data.difficulty || "normal";
              if (rankingsByDiff[diff]) {
                  rankingsByDiff[diff].push(data);
              }
          });
          
          Object.keys(rankingsByDiff).forEach(diff => {
              rankingsByDiff[diff].sort((a, b) => b.score - a.score);
              rankingsByDiff[diff] = rankingsByDiff[diff].slice(0, 10);
          });

          updateRankingData();
      }, (error) => {
          console.error("Firestore Snapshot Error:", error);
      });
}

async function checkAndSaveHighScore() {
    if (score <= 0) {
        saveStatusMsg.innerText = "";
        return;
    }

    const docId = `${playerName}_${selectedDifficulty}`;
    saveStatusMsg.innerText = "スコア保存中...";

    try {
        const userRef = db.collection("rankings_v2").doc(docId);
        const doc = await userRef.get();

        if (doc.exists) {
            const currentRecord = doc.data().score || 0;
            if (score > currentRecord) {
                await userRef.set({ name: playerName, score: score, difficulty: selectedDifficulty, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                saveStatusMsg.innerText = "★ 最高スコア更新！ ★";
            } else {
                saveStatusMsg.innerText = "スコア保存完了";
            }
        } else {
            await userRef.set({ name: playerName, score: score, difficulty: selectedDifficulty, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            saveStatusMsg.innerText = "★ ランキング初登録！ ★";
        }
    } catch (e) {
        console.error("Firestore Save HighScore Error:", e);
        saveStatusMsg.innerText = "スコア保存失敗";
    }
}

function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

    balls.forEach(ball => {
        if (ball.active) {
            const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            if (currentSpeed > 0) {
                ball.dx = (ball.dx / currentSpeed) * ballSpeed;
                ball.dy = (ball.dy / currentSpeed) * ballSpeed;
            }
        }
    });
}

function calculateBlockHp() {
    const setting = DIFFICULTY_SETTINGS[selectedDifficulty];
    const rand = Math.random();
    if (rand > setting.spawnProbability) {
        const baseHp = totalRowsSpawned;
        let calculatedHp = Math.floor(Math.random() * 3) + baseHp; 
        
        const bonusHp = Math.floor(calculatedHp / 5);
        calculatedHp += bonusHp;

        calculatedHp = Math.max(1, Math.round(calculatedHp * setting.hpMultiplier));
        return calculatedHp;
    }
    return 0;
}

function spawnRowAtTop() {
    let rowBlocks = [];
    let filledCount = 0;

    for (let c = 0; c < brickColumnCount; c++) {
        let hp = calculateBlockHp();
        if (hp > 0) filledCount++;
        rowBlocks.push(hp);
    }

    if (filledCount === brickColumnCount) {
        const emptyIndex = Math.floor(Math.random() * brickColumnCount);
        rowBlocks[emptyIndex] = 0;
    }

    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c].unshift({ type: "block", hp: rowBlocks[c] });
    }
}

function updateAimTarget(x, y) {

        aimY = startY - 5;
    } else {

    }
    aimX = x;
}

function endAim() {
    if (!isAiming || gameOver || quizModal.style.display === "block") return;
    isAiming = false;

    const diffX = aimX - startX;
    const diffY = aimY - startY; 
    const distance = Math.sqrt(diffX * diffX + diffY * diffY);
    if (distance > 0) {
        let targetDx = (diffX / distance) * ballSpeed;
        let targetDy = (diffY / distance) * ballSpeed;
        
        if (Math.abs(targetDy) < 1.5) {
            targetDy = -1.5;
        }

        balls = [];
        isBallMoving = true; 
        quizTriggerBtn.disabled = true;
        for (let i = 0; i < maxBalls; i++) {
            balls.push({ 
                x: startX, 
                y: startY, 
                dx: targetDx, 
                dy: targetDy, 
                active: false
            });
        }
        balls[0].active = true; 
        launchDelayCounter = 0;
    }
}

function checkRaySegmentIntersection(p1, p2, s1, s2) {
    const dx1 = p2.x - p1.x;
    const dy1 = p2.y - p1.y;
    const dx2 = s2.x - s1.x;
    const dy2 = s2.y - s1.y;
    const denom = dx1 * dy2 - dy1 * dx2;
    if (denom === 0) return null;
    const t = ((s1.x - p1.x) * dy2 - (s1.y - p1.y) * dx2) / denom;
    const u = ((s1.x - p1.x) * dy1 - (s1.y - p1.y) * dx1) / denom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
        return t;
    }
    return null;
}

function checkSingleBrickCollisionSweep(ball, startP, endP, c, r) {
    const b = bricks[c][r];
    if (!b || b.hp <= 0) return null;

    const brickX = c * (brickSize + brickPadding) + brickOffsetLeft;
    const brickY = r * (brickSize + brickPadding) + brickOffsetTop;

    const minX = brickX - ballRadius;
    const maxX = brickX + brickSize + ballRadius;
    const minY = brickY - ballRadius;
    const maxY = brickY + brickSize + ballRadius;

    const segments = [
        { side: 'top',    s1: { x: minX, y: minY }, s2: { x: maxX, y: minY } },
        { side: 'bottom', s1: { x: minX, y: maxY }, s2: { x: maxX, y: maxY } },
        { side: 'left',   s1: { x: minX, y: minY }, s2: { x: minX, y: maxY } },
        { side: 'right',  s1: { x: maxX, y: minY }, s2: { x: maxX, y: maxY } }
    ];

    let earliest = null;

    for (const seg of segments) {
        const t = checkRaySegmentIntersection(startP, endP, seg.s1, seg.s2);
        if (t !== null) {
            if (earliest === null || t < earliest.t) {
                earliest = { t, side: seg.side, c, r, brickX, brickY, b };
            }
        }
    }
    return earliest;
}

function handleItems() {
    const isPaused = quizModal.style.display === "block";

    for (let j = 0; j < items.length; j++) {
        let item = items[j];
        if (!item.active) continue;

        if (!isPaused) {
            item.y += itemFallSpeed;
        }

        for (let i = 0; i < balls.length; i++) {
            let ball = balls[i];
            if (!ball.active) continue;

            const dx = ball.x - item.x;
            const dy = ball.y - item.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < ballRadius + itemRadius) {
                item.active = false;
                maxBalls++; 
                ballCountDisplay.innerText = maxBalls;
                break;
            }
        }

        if (item.y > canvas.height + itemRadius) {
            item.active = false;
            continue;
        }

        ctx.beginPath();
        ctx.arc(item.x, item.y, itemRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#33ff00";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#fff";
        ctx.stroke();

        ctx.font = "bold 13px Arial";
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("+1", item.x, item.y);
    }
}

function handleBalls() {
    let anyBallActive = false;
    const isPaused = quizModal.style.display === "block";

    if (isBallMoving && !isPaused) {
        launchDelayCounter++;
        for (let i = 0; i < balls.length; i++) {
            if (!balls[i].active && launchDelayCounter >= i * launchDelay) {
                balls[i].active = true;
            }
        }
    }

    if (!isBallMoving) {
        ctx.beginPath();
        ctx.arc(startX, startY, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#00ffff"; 
        ctx.fill();
        return;
    }

    for (let i = 0; i < balls.length; i++) {
        let ball = balls[i];
        if (!ball.active) continue;

        if (!isPaused) {
            if (ball.y >= canvas.height - ballRadius) {
                ball.active = false;
                continue;
            }

            let startP = { x: ball.x, y: ball.y };
            let endP = { x: ball.x + ball.dx, y: ball.y + ball.dy };

            if (endP.x > canvas.width - ballRadius) {
                ball.dx = -Math.abs(ball.dx);
                ball.x = canvas.width - ballRadius - 0.1;
                endP.x = ball.x;
            } else if (endP.x < ballRadius) {
                ball.dx = Math.abs(ball.dx);
                ball.x = ballRadius + 0.1;
                endP.x = ball.x;
            }
            if (endP.y < ballRadius) {
                ball.dy = Math.abs(ball.dy);
                ball.y = ballRadius + 0.1;
                endP.y = ball.y;
            }

            let earliestHit = null;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < bricks[c].length; r++) {
                    const hit = checkSingleBrickCollisionSweep(ball, startP, endP, c, r);
                    if (hit) {
                        if (earliestHit === null || hit.t < earliestHit.t) {
                            earliestHit = hit;
                        }
                    }
                }
            }

            if (earliestHit) {
                ball.x = startP.x + (endP.x - startP.x) * earliestHit.t;
                ball.y = startP.y + (endP.y - startP.y) * earliestHit.t;

                const nudge = (Math.random() - 0.5) * 0.2;

                if (earliestHit.side === 'left' || earliestHit.side === 'right') {
                    ball.dx = -ball.dx + nudge;
                    if (earliestHit.side === 'left') ball.x = earliestHit.brickX - ballRadius - 0.2;
                    if (earliestHit.side === 'right') ball.x = earliestHit.brickX + brickSize + ballRadius + 0.2;
                } else {
                    ball.dy = -ball.dy + nudge;
                    if (earliestHit.side === 'top') ball.y = earliestHit.brickY - ballRadius - 0.2;
                    if (earliestHit.side === 'bottom') ball.y = earliestHit.brickY + brickSize + ballRadius + 0.2;
                }

                if (Math.abs(ball.dy) < 0.5) ball.dy = ball.dy < 0 ? -0.5 : 0.5;
                if (Math.abs(ball.dx) < 0.5) ball.dx = ball.dx < 0 ? -0.5 : 0.5;

                const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                if (currentSpeed > 0) {
                    ball.dx = (ball.dx / currentSpeed) * ballSpeed;
                    ball.dy = (ball.dy / currentSpeed) * ballSpeed;
                }

                earliestHit.b.hp -= 1;
                score += 10;
                scoreDisplay.innerText = score;

                if (earliestHit.b.hp <= 0) {
                    const dropRate = DIFFICULTY_SETTINGS[selectedDifficulty].itemDropRate;
                    if (Math.random() < dropRate) { 
                        items.push({
                            x: earliestHit.brickX + brickSize / 2,
                            y: earliestHit.brickY + brickSize / 2,
                            active: true
                        });
                    }
                }
            } else {
                ball.x = endP.x;
                ball.y = endP.y;
            }
        }
        
        anyBallActive = true; 

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = i === 0 ? "#00ffff" : "#00ffaa"; 
        ctx.fill();
    }

    if (isBallMoving && !anyBallActive && !isPaused) {
        isBallMoving = false;
        balls = [];          
        spawnNewRow();        
        hasAnsweredThisTurn = false;
        quizTriggerBtn.disabled = false; 
        saveGameState();
    }
}

function drawAimLine() {
    if (!isAiming || quizModal.style.display === "block") return;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(aimX, aimY);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < bricks[c].length; r++) {
            const b = bricks[c][r];
            if (b && b.hp > 0) {
                const brickX = c * (brickSize + brickPadding) + brickOffsetLeft;
                const brickY = r * (brickSize + brickPadding) + brickOffsetTop;

                let baseColor = "#ffff33"; let lightColor = "#ffff99";
                let darkColor = "#999900";
                
                if (b.hp >= 4 && b.hp < 10) {
                    baseColor = "#ff9900";
                    lightColor = "#ffcc99"; darkColor = "#996600";
                } else if (b.hp >= 10 && b.hp < 20) {
                    baseColor = "#ff3333";
                    lightColor = "#ff9999"; darkColor = "#990000";
                } else if (b.hp >= 20) {
                    baseColor = "#cc33ff";
                    lightColor = "#ecb3ff"; darkColor = "#660099";
                }

                let gradient = ctx.createLinearGradient(brickX, brickY, brickX + brickSize, brickY + brickSize);
                gradient.addColorStop(0, lightColor); gradient.addColorStop(1, baseColor);
                ctx.beginPath(); ctx.rect(brickX, brickY, brickSize, brickSize); ctx.fillStyle = gradient; ctx.fill();

                ctx.beginPath(); ctx.moveTo(brickX, brickY + brickSize);
                ctx.lineTo(brickX, brickY);
                ctx.lineTo(brickX + brickSize, brickY);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 3; ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(brickX, brickY + brickSize);
                ctx.lineTo(brickX + brickSize, brickY + brickSize); ctx.lineTo(brickX + brickSize, brickY);
                ctx.strokeStyle = darkColor; ctx.lineWidth = 3;
                ctx.stroke();
                ctx.font = "bold 16px Arial"; ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(b.hp, brickX + brickSize / 2 + 1, brickY + brickSize / 2 + 1);
                ctx.fillStyle = "#fff";
                ctx.fillText(b.hp, brickX + brickSize / 2, brickY + brickSize / 2);
            }
        }
    }
}

function drawEffects() {
    ctx.beginPath();
    ctx.moveTo(0, warningRedLineY);
    ctx.lineTo(canvas.width, warningRedLineY);
    ctx.strokeStyle = "rgba(255, 0, 0, 0.9)";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    if (warningTimer > 0 && !gameOver) {
        if (quizModal.style.display !== "block") {
            warningTimer--; 
            warningPulseCounter++;
        }
        let alpha = 0.25 + Math.sin(warningPulseCounter * 0.25) * 0.12;
        ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = "bold 36px Arial";
        ctx.fillStyle = `rgba(255, 51, 51, ${0.7 + Math.sin(warningPulseCounter * 0.3) * 0.3})`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("WARNING", canvas.width / 2, warningRedLineY - 40);
    }
}

function drawMessage(text, color) {
    ctx.font = "bold 32px Arial"; ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2.5);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawAimLine();
    handleBalls(); 
    handleItems(); 
    checkLinesStatus(); 
    drawEffects(); 

    if (gameOver) {
        drawMessage("GAME OVER", "#ff3333");
        return; 
    }

    requestAnimationFrame(draw);
}
</script>
